<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Information</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;

            background:
                radial-gradient(circle at 15% 20%, #334caa, transparent 35%),
                radial-gradient(circle at 85% 80%, #7c3aed, transparent 35%),
                linear-gradient(135deg, #080d27, #172554, #111827);
        }

        .student-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);

            color: white;
            text-align: center;

            transition: 0.4s ease;
        }

        .student-card::before {
            content: "";
            position: absolute;
            top: -100%;
            left: -50%;
            width: 200%;
            height: 200%;

            background: linear-gradient(
                120deg,
                transparent 35%,
                rgba(255, 255, 255, 0.10) 50%,
                transparent 65%
            );

            transform: rotate(25deg);
            pointer-events: none;
        }

        .student-card:hover {
            transform: translateY(-8px);
            box-shadow:
                0 35px 75px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(96, 165, 250, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .student-image {
            width: 160px;
            height: 160px;
            object-fit: cover;

            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 0 20px rgba(96, 165, 250, 0.5),
                0 0 40px rgba(139, 92, 246, 0.25);

            margin-bottom: 20px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 25px;
            letter-spacing: 1px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #93c5fd,
                #c4b5fd
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .student-details {
            text-align: left;
            padding: 20px;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;

            box-shadow: inset 0 1px 5px rgba(255, 255, 255, 0.08);
        }

        .student-details h3 {
            font-size: 15px;
            font-weight: 500;
            padding: 12px 5px;

            color: #e0e7ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .student-details h3:last-child {
            border-bottom: none;
        }

        .attendance {
            margin-top: 20px;
            padding: 17px;

            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .attendance h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 30px;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .present {
            color: #86efac;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.4);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }

        .absent {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;

            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;

            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.4);

            transition: 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-4px);
            box-shadow:
                0 12px 30px rgba(96, 165, 250, 0.5);
            background: linear-gradient(
                135deg,
                #3b82f6,
                #9333ea
            );
        }

        @media (max-width: 500px) {
            .student-card {
                padding: 23px;
            }

            h1 {
                font-size: 23px;
            }

            .student-details h3 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="student-card">

        <img
            src="{{ std[6] }}"
            alt="Student Image"
            class="student-image"
        >

        <h1>Student Information</h1>

        <div class="student-details">

            <h3>Name : {{ std[1] }}</h3>

            <h3>Age : {{ std[2] }}</h3>

            <h3>Gender : {{ std[3] }}</h3>

            <h3>Marks : {{ std[4] }}</h3>

            <h3>Course : {{ std[5] }}</h3>

            <h3>Status : {{ std[7] }}</h3>

        </div>

        <div class="attendance">

            <h3>Attendance</h3>

            {% if std[7] %}
                <span class="status present">PRESENT</span>
            {% else %}
                <span class="status absent">ABSENT</span>
            {% endif %}

        </div>

        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
